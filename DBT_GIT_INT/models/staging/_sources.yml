version: 2
sources:
- name: tb_src
  description: 'Point of Sale source data'
  database: TEST_DBT
  schema: LANDING
  tables:
  - name: ORDERS
    description: 'Country reference data'
    columns:
    - name: ORDER_ID
      description: 'Primary key for countries'
      data_tests:
        - not_null
        # - dbt_utils.accepted_range:  # Numeric range validation
        #     min_value: 1
        #     max_value: 1000
    - name: TRUCK_ID
      description: 'Country name'
      data_tests:
        - not_null
    - name: ORDER_DETAIL_ID
      description: 'ISO currency code'
    - name: LINE_NUMBER
      description: 'ISO country code'
      data_tests:
        - not_null
  - name: COUNTRIES
    description: 'Country reference data'
    columns:
    - name: COUNTRY
      description: 'Primary key for countries'
      data_tests:
        - not_null
        # - dbt_utils.accepted_range:  # Numeric range validation
        #     min_value: 1
        #     max_value: 1000
    - name: ISO_CURRENCY
      description: 'Country name'
      data_tests:
        - not_null   